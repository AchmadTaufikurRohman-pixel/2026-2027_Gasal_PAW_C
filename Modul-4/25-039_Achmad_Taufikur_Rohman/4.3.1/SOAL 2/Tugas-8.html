<!DOCTYPE html>
<html>
<head>
    <title>Form Data</title>
    <style>
        body {
            font-family: Arial;
            background-color: #e0ffff;
        }
        .form-box {
            width: 420px;
            margin: 50px auto;
            padding: 25px;
            background-color: #20b2aa;
            border-radius: 10px;
        }
        .field {
            margin-bottom: 10px;
        }
        .field label {
            display: block;
            color: white;
            margin-bottom: 5px;
        }
        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }
        .button input {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="form-box">

<form action="Tugas-9.php" method="POST">

    <div class="field">
        <label for="surname">Username</label>
        <input type="text" name="surname"/>
    </div>

    <div class="field">
        <label for="email">Email address</label>
        <input type="email" name="email"/>
    </div>

    <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password"/>
    </div>

    <div class="field">
        <label for="address">Address</label>
        <textarea name="address" rows="3" cols="30"></textarea>
    </div>

    <div class="field">
        <label for="country">Country</label>
        <select name="country">
            <option value="">-- choose your country --</option>
            <option value="Australian Capital Territory">Australia</option>
            <option value="Queensland">China</option>
            <option value="New South Wales">Indonesia</option>
        </select>
    </div>

    <div class="field">
        <label for="gender">Gender</label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
    </div>

    <div class="field">
        <label for="vegetarian">Vegetarian?</label>
        <input type="checkbox" name="vegetarian" value="Yes">
    </div>

    <div class="button">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>

</form>

</div>

</body>
</html>
